name: React Build Check
on:
  push:
    branches: [kathya-react]
    paths: ['react-site/**']
  pull_request:
    paths: ['react-site/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-site/package-lock.json
      - run: npm install
      - run: npm run build
