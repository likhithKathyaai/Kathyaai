name: React Build Check
on:
  push:
    branches: [kathya-react]
    paths: ['react-site/**', '.github/workflows/react-build.yml']
  pull_request:
    paths: ['react-site/**', '.github/workflows/react-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
